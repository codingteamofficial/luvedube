name: luvedube
description: "LuveDube SongWriter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: 7.0.0
  path_provider: ^2.0.0
  uuid: ^4.5.3
  share_plus: ^12.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/Luvedube.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/Luvedube.png"