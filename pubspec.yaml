name: luvedube
description: "LuveDube SongWriter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  google_fonts: ^8.0.2
  google_mobile_ads: 7.0.0
  path_provider: ^2.0.0  
  http: ^1.1.0
  uuid: ^4.5.3
  flutter:
    sdk: flutter  
  package_info_plus: ^9.0.0  
  intl: ^0.20.2   
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  assets:
    - assets/icons/Luvedube.png


flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/Luvedube.png"    